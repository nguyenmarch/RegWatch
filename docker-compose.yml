services:

  # ── Frontend (React + nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: regwatch_frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regwatch_app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_SERVER: mysql
      MYSQL_PORT: "3306"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: regwatch
      MINIO_SECRET_KEY: regwatch123
      MINIO_BUCKET: regwatch-documents
      MINIO_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

  # ── MinIO (object storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: regwatch_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: regwatch
      MINIO_ROOT_PASSWORD: regwatch123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MySQL 8.4 ───────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: regwatch_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: law_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (vector DB) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: regwatch_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Neo4j 5 (graph DB) ─────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: regwatch_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
  minio_data:
