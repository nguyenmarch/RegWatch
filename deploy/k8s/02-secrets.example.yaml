# Copy this file to 02-secrets.yaml and fill real values locally.
# 02-secrets.yaml is gitignored and must not be committed.
# Generate SECRET_KEY: python -c "import secrets; print(secrets.token_hex(32))"
# Neo4j auth format: "neo4j/<password>" (same password as NEO4J_PASSWORD)
# S3 uses the EKS node IAM role by default; MINIO_* keys are intentionally blank.
apiVersion: v1
kind: Secret
metadata:
  name: regwatch-secrets
  namespace: regwatch
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  MYSQL_PASSWORD: "CHANGE_ME"
  NEO4J_PASSWORD: "CHANGE_ME"
  NEO4J_AUTH: "neo4j/CHANGE_ME"
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  GEMINI_API_KEY: "CHANGE_ME"
