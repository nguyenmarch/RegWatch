apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: regwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 339388639465.dkr.ecr.us-east-1.amazonaws.com/regwatch/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: regwatch-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: SECRET_KEY
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: MYSQL_PASSWORD
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: NEO4J_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: MINIO_SECRET_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: regwatch-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          # Long startup probe to allow sentence-transformers model download (~5-10 min on first start)
          startupProbe:
            tcpSocket:
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
            initialDelaySeconds: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: hf-cache
          emptyDir: {}
